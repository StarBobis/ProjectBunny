;------------------------------------------------------------------------------------------------------
; ProjectBunny - 3DMigoto DX12 (d3d12.dll) configuration
;
; This is the DX12-only configuration. Options that are only implemented by
; the legacy DX11 runtime (the [Hunting], [Device], [Rendering] and [Logging]
; sections, and the non-dx12 keys in [System]) have been removed. The
; authoritative list of supported options lives in src/DirectX12 (see
; DX12ConfigLoader.h and DX12Config.h).
;------------------------------------------------------------------------------------------------------

;------------------------------------------------------------------------------------------------------
; Settings used by the external 3DMigoto Loader
;------------------------------------------------------------------------------------------------------
[Loader]
; WARNING! This release is intended to be loaded by XXMI Launcher and is missing required 3dmigoto DLLs!
; XXMI Launcher can be installed from https://github.com/SpectrumQT/XXMI-Launcher/releases/latest

; Target process to load into:
target = Game.exe

; Allow 3dmigoto DLL to be loaded by the following .exe:
loader = XXMI Launcher.exe

; WARNING! Options below are left for advanced users and will NOT be taken into account by XXMI Launcher!

; Automatically launch the game from the loader:
;launch = C:\Path\To\Game\Game.exe

; This tells the loader where to find the proxy DLL. It must be located
; in the same directory as the loader and will be loaded in the target
; process under the same name:
module = d3d12.dll

; Uncomment to always elevate the loader to support games that run as admin.
; This will display a UAC prompt so only enable it if you actually need it.
require_admin = true

; Delay this many extra seconds after confirming that 3DMigoto was loaded in
; the target process. Set to -1 to disable automatic shut down.
;delay = 20


;------------------------------------------------------------------------------------------------------
; Additional configuration files
;------------------------------------------------------------------------------------------------------
[Include]
; Include every .ini file (and any external files referred to by CustomShader
; / Resource sections) from the Mods directory:
include_recursive = Mods
exclude_recursive = DISABLED*
exclude_recursive = desktop.ini


;------------------------------------------------------------------------------------------------------
; DX12 runtime options
;------------------------------------------------------------------------------------------------------
[System]
; Delay in milliseconds before the initial mod config load after startup
; (default 2000).
dx12_config_initialization_delay_ms = 2000

;------------------------------------------------------------------------------------------------------
; Command list to run on launch / after config reload.
; Declare named global variables here to use them from other command lists,
; [Key] bindings and [Preset]s. Named variables are namespaced so that any
; included ini files can use their own without worrying about name clashes:
;------------------------------------------------------------------------------------------------------
[Constants]
;global $my_named_variable = 0.0

; Mark a variable as persistent to automatically save it to the d3dx_user.ini
; on exit or config reload:
;global persist $some_persistent_variable = 1

; Set the initial value of shader-visible "IniParams" constants (x/y/z/w):
;x = 0.8
;y = 1.0
;z = 1.2
;w = 2.0


;------------------------------------------------------------------------------------------------------
; Key bindings: For A-Z and 0-9 on the number row, just use that single
; character. For everything else (including mouse buttons), use the virtual key
; name (with or without the VK_ prefix) or hex code from this article:
; http://msdn.microsoft.com/en-us/library/windows/desktop/dd375731(v=vs.85).aspx
;
; Key combinations can be specified by separating key names with spaces, e.g.
; "Shift Q". It is also possible to indicate that a key must *not* be held for
; the binding to activate, e.g. "NO_ALT F1". "NO_MODIFIERS" may be used as a
; shorthand for excluding all standard modifiers (Ctrl, Alt, Shift, Windows).
;
; XBox controllers are supported using the XB_* key names (e.g. XB_A, XB_B,
; XB_X, XB_Y, XB_START, XB_BACK, XB_GUIDE, XB_DPAD_*, XB_LEFT_TRIGGER,
; XB_RIGHT_TRIGGER, XB_LEFT_SHOULDER, XB_RIGHT_SHOULDER, XB_LEFT_THUMB,
; XB_RIGHT_THUMB).
;
; Multiple keys may be set in a single [Key] section to allow keyboard and xbox
; controller toggles and cycles to share the same state as each other.
;------------------------------------------------------------------------------------------------------

; Example for changing default settings:
;[KeyBasicExample]
;Key = z
;x = 0.98

; Example to support momentary hold type overrides, like aiming:
;[KeyMomentaryHoldExample]
;Key = RBUTTON
;Key = XB_LEFT_TRIGGER
;type = hold

; Example for a toggle override that remembers the previous value and restores
; it automatically when pressed a second time:
;[KeyToggleExample]
;Key = q
;type = toggle
;y = 0.0

; Keys can only directly set variables to simple values. If you want to do
; something more advanced, you may need to call a command list from the key
; binding. type=hold/toggle keys will run the post phase of the command list on
; release:
;[KeyCommandListExample]
;key = f
;run = CommandListF
;[CommandListF]
;if $foo == 0 && cursor_showing
;	$foo = $bar * 3.14 / rt_width
;else
;	$foo = 0
;endif


;------------------------------------------------------------------------------------------------------
; Commands to run from the Present call at the start/end of each frame
;
; Useful to clear custom resources or ini params at the start of each frame, or
; to run a custom shader to do whatever you can dream up. The post keyword will
; make an action run at the start of a frame instead of the end.
;------------------------------------------------------------------------------------------------------
[Present]
; Example: Clear an ini param at the start of each frame:
;post x = 0
; Example: Undefine a custom resource until something is copied into it:
;post ResourceDepthBuffer = null


;------------------------------------------------------------------------------------------------------
; Mod sections supported by the DX12 runtime
;
; [ShaderOverride*]  - replace / skip shaders, run command lists on shader use
; [ShaderRegex*]     - on-the-fly regex patching of shader assembly
; [TextureOverride*] - texture / vertex-buffer / index-buffer overrides
; [Resource*]        - custom resource definitions (type, filename, format, ...)
; [CommandList*]     - reusable command lists
; [Key*]             - key bindings (see examples above)
;
; Example shader override:
;[ShaderOverride1]
;Hash=69732c4f23cb6c48
; don't draw anything using this shader:
;Handling=skip
; Override a value from [Constants] when this shader is used:
;x=2.0

; Example texture override:
;[TextureOverride1]
;Hash=c3e55ebd
;ib = ResourceExample
;match_vertex_count = 1000

; Example resource:
;[ResourceExample]
;type = buffer
;filename = data.bin
;stride = 16
;byte_width = 4096