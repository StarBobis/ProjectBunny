name: Release d3d12

# Automated release pipeline. The release version is controlled manually
# via the file .github/workflows/version.txt on the main branch: bump the
# number in that file and push to main, and this workflow builds the clean
# Release x64 d3d12.dll and publishes a GitHub Release tagged v<version>.
# Pushes that do not change the version are skipped automatically.
# You can also run the workflow manually from the Actions tab (optionally
# overriding the tag), or push a v* tag directly.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (default: from version.txt)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || '' }}"
          if (-not $tag -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag) {
            $version = (Get-Content ".github/workflows/version.txt" -Raw).Trim()
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              Write-Error "version.txt content '$version' must look like 1.2.3"
              exit 1
            }
            $tag = "v$version"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Release tag '$tag' must look like v1.2.3"
            exit 1
          }
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing -and "${{ github.ref_type }}" -ne "tag") {
            Write-Host "Tag $tag already exists, nothing to release. Bump .github/workflows/version.txt to publish a new release."
            "skip=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "skip=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release tag: $tag (skip=$([bool]$existing))"

      - name: Warn on CMakeLists version drift
        if: steps.resolve.outputs.skip != 'true'
        shell: pwsh
        run: |
          $m = Select-String -Path "CMakeLists.txt" -Pattern 'VERSION\s+(\d+\.\d+\.\d+)' | Select-Object -First 1
          $cmakeVersion = $m.Matches.Groups[1].Value
          $releaseVersion = "${{ steps.resolve.outputs.tag }}".TrimStart('v')
          if ($cmakeVersion -and $cmakeVersion -ne $releaseVersion) {
            Write-Host "::warning::CMakeLists.txt project version is $cmakeVersion but the release tag is $releaseVersion. The DLL will report $cmakeVersion."
          }

      - name: Enable MSVC environment
        if: steps.resolve.outputs.skip != 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Release x64, Ninja)
        if: steps.resolve.outputs.skip != 'true'
        run: cmake -S . -B build/ci-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DDX12_RELEASE_TIMING=OFF

      - name: Build d3d12.dll
        if: steps.resolve.outputs.skip != 'true'
        run: cmake --build build/ci-release --target DirectX12

      - name: Package zip
        if: steps.resolve.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          $dll = "build/ci-release/src/DirectX12/d3d12.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "Expected build output not found: $dll"
            exit 1
          }
          $stage = "build/release-stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $dll "$stage/d3d12.dll"
          Copy-Item "LICENSE.txt" "$stage/LICENSE.txt"
          $zipName = "ProjectBunny-$env:RELEASE_TAG-d3d12-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath "build/$zipName" -CompressionLevel Optimal -Force
          Write-Host "Packaged: build/$zipName"
          "ZIP_PATH=build/$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub Release
        if: steps.resolve.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: ProjectBunny ${{ steps.resolve.outputs.tag }}
          generate_release_notes: true
          files: ${{ env.ZIP_PATH }}
